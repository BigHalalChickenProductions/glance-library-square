name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Build zip
        run: |
          mkdir -p out/glance-library
          cp -r plugin.json package.json main.py dist py_modules icons LICENSE THIRD_PARTY_LICENSES.md out/glance-library/
          (cd out && zip -rq ../glance-library.zip glance-library)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping"
            exit 0
          fi
          gh release create "$tag" glance-library.zip \
            --title "Glance Library v${{ steps.v.outputs.version }}" \
            --notes "Glance Library Square build." \
            --target "$GITHUB_SHA"
